<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
* { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
html { scroll-behavior: smooth; }

/* ─────────────────  TOKENS  ───────────────── */
:root {
  /* Surfaces */
  --paper:   #f7f3e8;     /* warm cream — primary light background */
  --paper-2: #ede8d8;     /* deeper warm — alternate panels */
  --paper-3: #e2dcc6;     /* edge / divider on paper */
  --white:   #fdfcf7;
  --rule:    #d8d1ba;
  --line:    #e3ddc9;

  /* Inks */
  --ink:     #14201a;     /* near-black with warm green undertone */
  --ink-2:   #2a362e;
  --muted:   #5f6b5d;
  --faint:   #8d9588;

  /* Greens */
  --deep:    #0c1a10;     /* hero / contact deepest */
  --forest:  #15291a;     /* dark sections */
  --green:   #1e3d22;     /* primary brand */
  --moss:    #3d6637;     /* mid */
  --sage:    #7d9974;     /* light accent on dark */
  --brand-green: #82b275; /* ED + hero accent — slightly darker, reads strongly on dark bg */
  --brand-green-on-light: #2e5a2a; /* darker version for light bg */

  /* Accent */
  --gold:    #b8932e;
  --gold-lt: #d4ae54;
  --cream:   #f7f3e8;     /* alias for use on dark */
}

body {
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
  overflow-x: hidden;
  line-height: 1.55;
  font-feature-settings: "ss01", "cv11";
}

/* Subtle paper grain on light surfaces */
.grain {
  position: relative;
}
.grain::before {
  content: ""; position: absolute; inset: 0;
  pointer-events: none;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.08 0 0 0 0 0.12 0 0 0 0 0.08 0 0 0 0.08 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  opacity: 0.35;
  mix-blend-mode: multiply;
  z-index: 0;
}
.grain > * { position: relative; z-index: 1; }

/* ─────────────────  TYPE  ───────────────── */
.serif    { font-family: 'Fraunces', serif; }
.mono     { font-family: 'JetBrains Mono', ui-monospace, monospace; }
h1, h2, h3, h4 { font-family: 'Fraunces', serif; font-weight: 300; letter-spacing: -0.025em; line-height: 1.02; color: var(--ink); }
h1 em, h2 em, h3 em { font-style: italic; font-weight: 400; }
p  { line-height: 1.65; }

/* Editorial chapter marker (Roman numeral + label) */
.chapter {
  display: flex; align-items: baseline; gap: 18px;
  margin-bottom: 28px;
}
.chapter .roman {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 500;
  letter-spacing: 0.18em;
  color: var(--muted);
  text-transform: uppercase;
}
.chapter .roman::after {
  content: "·"; margin: 0 12px; color: var(--rule);
}
.chapter .label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; font-weight: 400;
  letter-spacing: 0.18em;
  color: var(--ink-2);
  text-transform: uppercase;
}
.chapter.on-dark .roman { color: rgba(247,243,232,0.5); }
.chapter.on-dark .label { color: rgba(247,243,232,0.85); }
.chapter.on-dark .roman::after { color: rgba(247,243,232,0.25); }

/* Eyebrow (alternate to chapter) */
.eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; font-weight: 500;
  letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted);
  display: inline-flex; align-items: center; gap: 12px;
}
.eyebrow::before { content:""; width:24px; height:1px; background:currentColor; flex-shrink:0; opacity:.6; }
.eyebrow.on-dark { color: rgba(247,243,232,0.55); }

/* ─────────────────  LAYOUT  ───────────────── */
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 48px; }
@media(max-width:640px){ .wrap { padding: 0 24px; } }
.section { padding: 140px 0; position: relative; }
@media(max-width:768px){ .section { padding: 84px 0; } }

.hide-mobile { display: block; }
@media(max-width:900px){ .hide-mobile { display: none; } }

/* ─────────────────  BUTTONS  ───────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 12px;
  font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
  letter-spacing: 0.01em;
  padding: 16px 26px;
  border-radius: 0;
  cursor: pointer; white-space: nowrap; text-decoration: none;
  transition: all .25s ease;
  border: 1px solid transparent;
  background: none;
}
.btn .arr { transition: transform .25s; font-size: 14px; }
.btn:hover .arr { transform: translateX(4px); }

.btn-light { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.btn-light:hover { background: var(--white); border-color: var(--white); transform: translateY(-1px); box-shadow: 0 12px 28px rgba(0,0,0,.18); }

.btn-dark  { background: var(--green); color: var(--paper); border-color: var(--green); }
.btn-dark:hover { background: var(--deep); border-color: var(--deep); transform: translateY(-1px); box-shadow: 0 12px 28px rgba(20,40,18,.25); }

.btn-outline-dark { color: var(--ink); border-color: var(--rule); }
.btn-outline-dark:hover { border-color: var(--green); color: var(--green); }

.btn-outline-light { color: var(--paper); border-color: rgba(247,243,232,0.25); }
.btn-outline-light:hover { border-color: var(--paper); background: rgba(247,243,232,0.05); }

/* Pseudo-link with underline */
.linklike {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500;
  color: var(--ink); text-decoration: none; cursor: pointer; background: none; border: none;
  padding: 4px 0;
  border-bottom: 1px solid var(--ink);
  transition: color .2s, border-color .2s;
}
.linklike:hover { color: var(--green); border-color: var(--green); }
.linklike.on-dark { color: var(--gold-lt); border-color: rgba(212,174,84,0.35); }
.linklike.on-dark:hover { border-color: var(--gold-lt); }

/* ─────────────────  NAV  ───────────────── */
#nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 90;
  height: 100px;
  display: flex; align-items: center;
  transition: background .35s ease, border-color .35s ease, backdrop-filter .35s ease, height .35s ease;
  border-bottom: 1px solid transparent;
}
#nav.at-top { background: transparent; }
#nav.scrolled-dark { background: rgba(12,26,16,0.86); backdrop-filter: blur(18px) saturate(1.2); border-color: rgba(255,255,255,0.06); height: 68px; }
#nav.scrolled-light { background: rgba(247,243,232,0.92); backdrop-filter: blur(18px) saturate(1.1); border-color: var(--paper-3); height: 68px; }

.nav-inner { display: flex; align-items: center; justify-content: space-between; width: 100%; }

/* Logo */
.logo { display: inline-flex; flex-direction: column; align-items: flex-start; text-decoration: none; line-height: 1; }
.logo-name {
  font-family: 'Fraunces', serif;
  font-size: 24px; font-weight: 600;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  color: var(--paper);
  transition: color .3s, font-size .35s ease;
}
.logo-name .ED { color: var(--brand-green); transition: color .3s; }
.logo-sub {
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px; font-weight: 500;
  letter-spacing: 0.34em;
  text-transform: uppercase;
  color: rgba(247,243,232,0.55);
  margin-top: 8px;
  transition: color .3s;
}
#nav.scrolled-light .logo-name { color: var(--ink); }
#nav.scrolled-light .logo-name .ED { color: var(--brand-green-on-light); }
#nav.scrolled-light .logo-sub { color: var(--muted); }

/* Logo grows at top of page, shrinks once scrolled */
#nav .logo-name { font-size: 36px; }
#nav .logo-sub { font-size: 14px; transition: color .3s, font-size .35s ease; }
#nav.at-top .logo-name { font-size: 56px; }
#nav.at-top .logo-sub { font-size: 14px; }

/* Nav links */
.nav-links { display: flex; align-items: center; gap: 36px; }
@media(max-width:960px){ .nav-links { display: none; } }
.nav-links a {
  font-family: 'Inter', sans-serif;
  font-size: 13px; font-weight: 500;
  text-decoration: none; color: rgba(247,243,232,0.7);
  transition: color .2s;
}
.nav-links a:hover { color: var(--paper); }
#nav.scrolled-light .nav-links a { color: var(--muted); }
#nav.scrolled-light .nav-links a:hover { color: var(--ink); }
/* Buttons in the nav keep their own contrast — override generic nav-link color */
.nav-links a.btn-light,
#nav.scrolled-light .nav-links a.btn-light,
.nav-links a.btn-light:hover,
#nav.scrolled-light .nav-links a.btn-light:hover { color: var(--ink); }

/* Mobile menu */
.hamburger {
  display: none; background: none; border: none; cursor: pointer;
  width: 36px; height: 36px;
  align-items: center; justify-content: center;
  color: var(--paper);
}
@media(max-width:960px){ .hamburger { display: flex; } }
#nav.scrolled-light .hamburger { color: var(--ink); }

#mobile-nav {
  position: fixed; inset: 0; z-index: 95;
  background: var(--deep);
  transform: translateX(100%); transition: transform .35s ease;
  display: flex; flex-direction: column; justify-content: center;
  padding: 48px;
}
#mobile-nav.open { transform: translateX(0); }
#mobile-nav a {
  font-family: 'Fraunces', serif; font-size: 40px; font-weight: 300;
  color: var(--paper); text-decoration: none; letter-spacing: -0.01em;
  display: block; padding: 14px 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}
#mobile-nav a:hover { color: var(--gold-lt); }
#mobile-nav a.btn-light,
#mobile-nav a.btn-light:hover { color: var(--ink); font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 500; border-bottom: 0; padding: 18px 28px; }
.mobile-close {
  position: absolute; top: 28px; right: 28px;
  background: none; border: none; color: var(--paper); cursor: pointer;
  font-size: 22px;
}

/* ═════════════════════  HERO  ═════════════════════ */
#hero {
  background: var(--deep);
  min-height: 100dvh;
  position: relative;
  display: block;
  overflow: hidden;
}
@media(max-width:900px){ #hero { min-height: auto; } }

/* Full-bleed background image updated with local assets directory path */
.hero-bg {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover;
  z-index: 0;
  filter: brightness(0.55) saturate(0.7) contrast(1.04);
  transform: scale(1.0);
  transition: transform 16s ease;
  background-image: url('assets/hero-bg.jpg');
}
#hero.loaded .hero-bg { transform: scale(1.06); }

/* Soft-edged dark box behind the hero text */
.hero-backdrop {
  position: absolute;
  z-index: 1;
  top: 130px; bottom: 50px;
  left: max(0px, calc(50vw - 640px));
  width: min(820px, 62%);
  background: rgba(12, 26, 16, 0.82);
  -webkit-mask-image: radial-gradient(ellipse 70% 75% at 38% 50%, #000 18%, rgba(0,0,0,0.7) 45%, rgba(0,0,0,0.3) 70%, transparent 100%);
  mask-image: radial-gradient(ellipse 70% 75% at 38% 50%, #000 18%, rgba(0,0,0,0.7) 45%, rgba(0,0,0,0.3) 70%, transparent 100%);
  pointer-events: none;
}
@media(max-width:1100px){
  .hero-backdrop { width: 72%; }
}
@media(max-width:900px){
  .hero-backdrop {
    width: 100%; top: 0; bottom: 0;
    left: 0;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.85) 25%, rgba(0,0,0,0.85) 75%, transparent 100%);
    mask-image: linear-gradient(to bottom, transparent 0%, rgba(0,0,0,0.85) 25%, rgba(0,0,0,0.85) 75%, transparent 100%);
  }
}

.hero-wrap {
  position: relative;
  z-index: 2;
}

.hero-left {
  padding: 220px 0 60px;
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative;
  z-index: 2;
  max-width: 760px;
}
@media(max-width:1100px){ .hero-left { padding: 200px 0 60px; } }
@media(max-width:900px){ .hero-left { padding: 180px 0 64px; min-height: 80vh; } }

/* Vertical green rule on the very left, decorative */
.hero-left::before {
  content: ""; position: absolute;
  left: -28px; top: 220px; bottom: 60px;
  width: 1px; background: linear-gradient(to bottom, rgba(212,174,84,0.4), transparent 60%);
}
@media(max-width:1100px){ .hero-left::before { left: -20px; top: 200px; } }
@media(max-width:900px){ .hero-left::before { display: none; } }

.hero-meta-row {
  display: flex; gap: 28px; align-items: center; flex-wrap: wrap;
  margin-bottom: 56px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(247,243,232,0.45);
}
.hero-meta-row .sep { color: rgba(247,243,232,0.2); }
.hero-meta-row .live-dot {
  display: inline-flex; align-items: center; gap: 8px;
  color: rgba(247,243,232,0.65);
}
.hero-meta-row .live-dot::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold-lt);
  box-shadow: 0 0 0 4px rgba(212,174,84,0.15);
  animation: pulse 2.4s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { box-shadow: 0 0 0 4px rgba(212,174,84,0.15); }
  50% { box-shadow: 0 0 0 7px rgba(212,174,84,0.04); }
}

.hero-headline {
  font-size: clamp(38px, 4.8vw, 72px);
  font-weight: 200;
  letter-spacing: -0.035em;
  line-height: 1.02;
  color: var(--paper);
  margin-bottom: 36px;
}
.hero-headline em { color: var(--brand-green); font-style: italic; font-weight: 300; }

/* Rotating word in hero headline */
.hero-headline .rotator {
  display: inline-block;
  position: relative;
  white-space: nowrap;
}
.hero-headline .rotator-word {
  display: inline-block;
  transition: opacity .5s ease, transform .5s cubic-bezier(.23,1,.32,1);
}
.hero-headline .rotator-word.out {
  opacity: 0;
  transform: translateY(-0.32em);
}
.hero-headline .rotator-word.in {
  opacity: 0;
  transform: translateY(0.32em);
}
@media (prefers-reduced-motion: reduce) {
  .hero-headline .rotator-word { transition: opacity .5s ease; }
  .hero-headline .rotator-word.out,
  .hero-headline .rotator-word.in { transform: none; }
}
.hero-headline strong { font-weight: 400; }
.hero-headline .by { display: block; font-size: 0.65em; font-weight: 300; letter-spacing: -0.025em; color: rgba(247,243,232,0.85); margin-top: 4px; }

.hero-lede {
  font-family: 'Fraunces', serif;
  font-size: 18px; font-weight: 300; line-height: 1.55;
  color: rgba(247,243,232,0.68);
  max-width: 440px;
  margin-bottom: 44px;
  letter-spacing: -0.01em;
}

.hero-cta-row { display: flex; flex-wrap: wrap; gap: 12px; }

.hero-credibility {
  margin-top: 80px;
  padding-top: 36px;
  border-top: 1px solid rgba(247,243,232,0.1);
  display: grid; grid-template-columns: repeat(3,1fr); gap: 28px;
}
@media(max-width:560px){ .hero-credibility { grid-template-columns: 1fr 1fr; } }
.cred-item .label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  color: rgba(247,243,232,0.4); margin-bottom: 10px;
}
.cred-item .value {
  font-family: 'Fraunces', serif;
  font-size: 14px; font-weight: 400;
  color: var(--paper); line-height: 1.4;
}
.cred-item .value strong { font-weight: 500; }

/* Hero meta in image corner */
.hero-img-meta {
  position: absolute;
  right: 48px; bottom: 48px; z-index: 3;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(247,243,232,0.45);
  text-align: right;
}
.hero-img-meta::before {
  content: ""; display: block;
  width: 28px; height: 1px;
  background: rgba(247,243,232,0.3);
  margin-left: auto; margin-bottom: 10px;
}

/* Classroom supplies image, right side of hero */
.hero-supplies {
  position: absolute;
  right: max(0px, calc(50vw - 640px));
  bottom: 40px;
  width: min(560px, 44%);
  height: auto;
  z-index: 2;
  pointer-events: none;
  filter: drop-shadow(0 25px 40px rgba(0,0,0,0.5));
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 1.2s ease .4s, transform 1.2s ease .4s;
}
#hero.loaded .hero-supplies { opacity: 1; transform: translateY(0); }
@media(max-width:1100px){ .hero-supplies { width: 48%; } }
@media(max-width:900px){ .hero-supplies { display: none; } }

/* Hero accent gold rule */
.hero-rule {
  position: absolute; left: 0; bottom: 0;
  height: 1px; width: 240px;
  background: linear-gradient(90deg, var(--gold-lt), transparent);
  z-index: 3;
}

/* ═════════════════════  TRUSTED  ═════════════════════ */
#trusted {
  background: var(--paper-2);
  border-top: 1px solid var(--rule);
  border-bottom: 1px solid var(--rule);
  padding: 56px 0;
}
.trusted-label {
  display: flex; align-items: center; justify-content: center; gap: 16px;
  margin-bottom: 36px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
  color: var(--muted);
}
.trusted-label::before, .trusted-label::after {
  content: ""; flex: 0 1 80px; height: 1px; background: var(--rule);
}

.marquee { overflow: hidden; mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.marquee-track {
  display: flex; align-items: center; gap: 72px;
  width: max-content;
  animation: marquee 50s linear infinite;
}
@keyframes marquee { from{transform:translateX(0)} to{transform:translateX(-50%)} }
.partner-item {
  display: inline-flex; align-items: center; gap: 12px;
  filter: grayscale(1); opacity: 0.6;
  transition: opacity .3s, filter .3s;
  white-space: nowrap;
  height: 48px;
}
.partner-item:hover { opacity: 1; filter: grayscale(0); }
.partner-item img { max-height: 40px; max-width: 110px; object-fit: contain; }
.partner-item .pname {
  font-family: 'Fraunces', serif;
  font-size: 14px; font-weight: 500; letter-spacing: -0.01em;
  color: var(--ink-2); line-height: 1.1;
}
.partner-item .pname span {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-weight: 400; font-size: 9px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted);
  margin-top: 2px;
}

/* ═════════════════════  APPROACH  ═════════════════════ */
#approach {
  background: var(--paper);
}

.section-head {
  display: grid; grid-template-columns: 1fr 1fr;
  gap: 64px; align-items: end;
  margin-bottom: 96px;
}
@media(max-width:900px){ .section-head { grid-template-columns: 1fr; gap: 32px; margin-bottom: 64px; } }

.section-head h2 {
  font-size: clamp(34px, 4vw, 58px);
  font-weight: 300;
}
.section-head h2 em { color: var(--moss); font-style: italic; }
.section-head h2 .nowrap-line { display: inline-block; white-space: nowrap; }
/* Allow the headline to shrink with viewport so the two nowrap lines always fit */
@media(max-width:760px){
  .section-head h2 { font-size: min(58px, 7.2vw); }
}
.section-head .head-aside {
  font-family: 'Fraunces', serif;

  <script>
// ── Global Calendly Script Integrations ──
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.btn-dark, .linklike, .btn-light').forEach(button => {
    if (button.textContent.includes('Schedule')) {
      button.addEventListener('click', (e) => {
        e.preventDefault();
        Calendly.initPopupWidget({
          url: 'https://calendly.com/mark-rootedk12/1-1-with-mark'
        });
      });
    }
  });
});

// Hero animation
setTimeout(()=>{ document.getElementById('hero')?.classList.add('loaded'); }, 200);

// Reveal everything in hero immediately
document.querySelectorAll('#hero .reveal').forEach(el => el.classList.add('visible'));

// ── Hero rotating word ──
(function initRotator(){
  const el = document.querySelector('.hero-headline .rotator-word');
  if(!el) return;
  const words = ['sustainable', 'scalable', 'strategic', 'secure', 'safe'];
  let i = 0;
  const HOLD = 2200;   // time each word stays
  const SWAP = 500;    // matches CSS transition
  setInterval(()=>{
    el.classList.add('out');
    setTimeout(()=>{\
      i = (i + 1) % words.length;\
      el.textContent = words[i];\
      el.classList.remove('out');\
      el.classList.add('in');\
      // force reflow so the 'in' start state applies before we remove it\
      void el.offsetWidth;\
      el.classList.remove('in');\
    }, SWAP);\
  }, HOLD + SWAP);\
})();

const obs = new IntersectionObserver(entries=>{\
  entries.forEach(e=>{\
    if(e.isIntersecting){\
      e.target.classList.add('visible');\
      obs.unobserve(e.target);\
    }\
  });\
},{threshold:0.06, rootMargin:'0px 0px -40px 0px'});\

document.querySelectorAll('.reveal:not(#hero .reveal)').forEach(el=>{\
  obs.observe(el);\
});\
</script>
